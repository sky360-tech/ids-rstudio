name: Daily Code Activity

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  code-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Perform 20 to 60 Code Changes
        run: |
          git config --global user.name "sky360-tech"
          git config --global user.email "tahmirhasanraid1@gmail.com"

          TOTAL_COMMITS=$(( (RANDOM % 41) + 20 ))
          echo "Executing $TOTAL_COMMITS code commits today..."

          for i in $(seq 1 $TOTAL_COMMITS); do
            python "${{ github.workspace }}/.github/scripts/code_changer.py"
            git add generated_utils.py
            git commit -m "refactor: optimize security utility routines (pass $i/$TOTAL_COMMITS)"
          done

      - name: Push Changes
        run: |
          git pull --rebase origin main
          git push origin main
